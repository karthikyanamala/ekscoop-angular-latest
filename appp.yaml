runtime: python39

handlers:
  # ✅ Serve sitemap.xml directly
  - url: /sitemap\.xml
    static_files: sitemap.xml
    upload: sitemap\.xml
    mime_type: text/xml

  # ✅ Serve robots.txt directly
  - url: /robots\.txt
    static_files: robots.txt
    upload: robots\.txt
    mime_type: text/plain

  # ✅ Efficient caching for all static assets (1 year + immutable)
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|json|map))
    static_files: \1
    upload: (.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|json|map))
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  # ✅ Serve HTML files with short cache for SPA routing
  - url: /(.*\.html)
    static_files: \1
    upload: (.*\.html)
    http_headers:
      Cache-Control: "no-cache"

  # ✅ Angular fallback route (client-side routing)
  - url: /.*
    static_files: index.html
    upload: index.html
    http_headers:
      Cache-Control: "no-cache"



runtime: nodejs18
entrypoint: npm run serve:ssr

handlers:
  # ✅ Serve sitemap.xml from SSR browser dist folder
  - url: /sitemap\.xml
    static_files: dist/ekscoop/browser/sitemap.xml
    upload: dist/ekscoop/browser/sitemap\.xml
    mime_type: text/xml

  # ✅ Serve robots.txt
  - url: /robots\.txt
    static_files: dist/ekscoop/browser/robots.txt
    upload: dist/ekscoop/browser/robots\.txt
    mime_type: text/plain

  # ✅ Efficient caching for static assets (1 year + immutable)
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|json|map))
    static_files: dist/ekscoop/browser/\1
    upload: dist/ekscoop/browser/(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf|webp|json|map))
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  # ✅ Serve static .html files with short cache (if any are directly accessed)
  - url: /(.*\.html)
    static_files: dist/ekscoop/browser/\1
    upload: dist/ekscoop/browser/(.*\.html)
    http_headers:
      Cache-Control: "no-cache"

  # ✅ Fallback all other routes to SSR server handler (via entrypoint)
  - url: /.*
    script: auto
