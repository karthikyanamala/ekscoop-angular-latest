<!-- testimonial-carousel.component.html -->
<section class="carousel-section">
  <h2 class="title">What Clients Say</h2>

  <div class="carousel-container">
    <div class="testimonial-card" *ngFor="let t of getVisibleTestimonials()" [class.active]="t === testimonials[currentIndex]">
      <div class="avatar">{{ t.name.charAt(0) }}</div>
      <div class="stars">
        <ng-container *ngFor="let s of [].constructor(5); let i = index">
          <span class="star" [class.filled]="i < t.rating">★</span>
        </ng-container>
      </div>
      <h3>{{ t.name }}</h3>
      <p class="title-sm" *ngIf="t.title">{{ t.title }}</p>
      <p class="text">"{{ t.text }}"</p>
    </div>
  </div>

  <div class="controls">
    <button (click)="prev()">‹</button>
    <button (click)="togglePlay()">{{ isPlaying ? 'Pause' : 'Play' }}</button>
    <button (click)="next()">›</button>
  </div>

  <div class="dots">
    <span
      *ngFor="let t of testimonials; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goTo(i)">
    </span>
  </div>
</section>
