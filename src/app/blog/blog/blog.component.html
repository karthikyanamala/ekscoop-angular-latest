<div class="blog-container">
  <h1>ekScoop Blog</h1>
  <p class="subtitle">Daily nutrition tips, meal hacks, and protein truths for Indian homes.</p>

  <div class="blog-grid">
    <div class="blog-card" *ngFor="let blog of blogs">
      <img [src]="blog.image" alt="{{ blog.title }}">
      <div class="blog-content">
        <h2>{{ blog.title }}</h2>
        <p>{{ blog.description }}</p>
        <a [routerLink]="['/blog', blog.slug]" class="read-more">Read More →</a>
      </div>
    </div>
  </div>
</div>
